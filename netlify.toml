[build]
  base    = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to   = "https://trichat.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/hubs/*"
  to   = "https://trichat.onrender.com/hubs/:splat"
  status = 200
  force = true

[functions]
  directory = "functions"
